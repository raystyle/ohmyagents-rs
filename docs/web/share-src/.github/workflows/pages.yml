name: Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Source -> binary supply-chain gate. The committed crypto WASM is the opaque
  # primitive the browser trusts; this job re-derives it from the rmux Rust source
  # at the pinned source_commit (scripts/verify-wasm-from-source.mjs) and asserts
  # byte-for-byte equality with the shipped blob.
  verify-wasm-source:
    name: WASM source-to-binary gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read pinned rmux commit and toolchain from PROVENANCE
        id: pin
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("src/scripts/share/wasm/PROVENANCE.json", "utf8"));
            const commit = p.source.source_commit, rustc = p.toolchain.rustc;
            if (!/^[0-9a-f]{40}$/.test(commit)) throw new Error("source_commit is not a 40-hex sha");
            if (!rustc) throw new Error("toolchain.rustc is missing");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${commit}\nrustc=${rustc}\n`);
          '

      - name: Check out rmux source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Helvesec/rmux
          path: rmux-src
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve pinned source_commit reachability
        id: reach
        run: |
          set -euo pipefail
          git -C rmux-src config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git -C rmux-src fetch --quiet --all --tags
          if git -C rmux-src cat-file -e '${{ steps.pin.outputs.commit }}^{commit}' 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: steps.reach.outputs.reachable == 'true'
        with:
          toolchain: ${{ steps.pin.outputs.rustc }}
          targets: wasm32-unknown-unknown

      - name: Install pinned wasm-pack
        if: steps.reach.outputs.reachable == 'true'
        run: command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --version 0.13.1 --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.reach.outputs.reachable == 'true'
        with:
          node-version: 22

      - name: Rebuild WASM from source and assert byte-equality (fail-closed)
        if: steps.reach.outputs.reachable == 'true'
        env:
          RMUX_SOURCE_DIR: ${{ github.workspace }}/rmux-src
        run: node scripts/verify-wasm-from-source.mjs

      - name: Fail if pinned rmux source is not public
        if: steps.reach.outputs.reachable != 'true'
        run: |
          commit='${{ steps.pin.outputs.commit }}'
          {
            echo "## WASM source→binary gate failed"
            echo ""
            echo "Pinned source_commit \`${commit}\` is not yet reachable on the public"
            echo "Helvesec/rmux remote, so the rebuild-from-source check could not run."
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::error title=WASM source gate failed::source_commit ${commit} not reachable on public rmux"
          exit 1

  build:
    name: Build static frontend
    needs: verify-wasm-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:cloudflare-policy
      - run: npm run build
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rmux-web-share-dist-${{ github.sha }}
          path: |
            dist
            package.json
            package-lock.json
            scripts/enforce-cloudflare-project-policy.mjs
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  verify-deployment-bundle:
    name: Verify deployable bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - name: Verify deployment bundle layout
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/release-bundle"
          test -f "$root/package-lock.json"
          test -f "$root/package.json"
          test -f "$root/scripts/enforce-cloudflare-project-policy.mjs"
          test -f "$root/dist/index.html"
          test -f "$root/dist/.well-known/rmux-web-share.json"
          test -f "$root/dist/checksums.txt"

  deploy:
    name: Deploy static frontend
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, verify-deployment-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-web-share
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ github.workspace }}/release-bundle
      - name: Verify deployment bundle layout
        run: |
          set -euo pipefail
          test -f release-bundle/package-lock.json
          test -f release-bundle/package.json
          test -f release-bundle/scripts/enforce-cloudflare-project-policy.mjs
          test -f release-bundle/dist/index.html
          test -f release-bundle/dist/.well-known/rmux-web-share.json
          test -f release-bundle/dist/checksums.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release-bundle/package-lock.json
      - name: Install the locked deployment client
        working-directory: release-bundle
        run: npm ci
      - name: Enforce a single production deployment writer
        working-directory: release-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: rmux-web-share
        run: node scripts/enforce-cloudflare-project-policy.mjs
      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: release-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --no-install wrangler pages deploy dist \
            --project-name=rmux-web-share \
            --branch=main \
            --commit-dirty=true | tee wrangler-deploy.log
          deploy_url="$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' wrangler-deploy.log | tail -n 1 || true)"
          echo "url=${deploy_url}" >> "$GITHUB_OUTPUT"
      - name: Publish deployment proof
        run: |
          set -euo pipefail
          {
            echo "## Deployment proof"
            echo ""
            echo "- GitHub SHA-1: \`${GITHUB_SHA}\`"
            echo "- Source commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "- GitHub Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Cloudflare Pages project: \`rmux-web-share\`"
            if [ -n "${{ steps.deploy.outputs.url }}" ]; then
              echo "- Cloudflare deployment: ${{ steps.deploy.outputs.url }}"
            fi
            echo "- Public domain: https://share.rmux.io"
            echo "- Public provenance: https://share.rmux.io/.well-known/rmux-web-share.json"
            echo "- Asset checksums: https://share.rmux.io/checksums.txt"
            echo ""
            echo "share.rmux.io serves only the static frontend and does not relay terminal data. Terminal frames are end-to-end encrypted, the token stays in the URL fragment, the source is public, builds are verifiable, deployments are traceable, and the frontend can be self-hosted."
          } >> "$GITHUB_STEP_SUMMARY"
