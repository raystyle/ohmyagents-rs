# 四家 agent pin：信任锚是本文件（及用户本地覆盖层 ~/.ohmyagents\catalog\agents.toml）的 sha256，
# 不是现场官方清单（与 rmux.toml 同原则）。oma agents update 解析最新版后写回用户本地层，仓库层是出厂锚。
# 渠道（sources 按序尝试：github 默认、CDN 兜底）；资产按 source 绑定——同一家不同渠道的制品可能不同
# （kimi 实证：GitHub 是 zip，CDN manifest 是裸单二进制，checksum 各异）。
# 校验和取证（2026-08-31，方法见 docs\research\S017 第四节与本文件各注释）：
#   claude v2.1.251     —— GitHub release 附 SHASUMS256.txt
#   codex rust-v0.151.0 —— GitHub release 附 codex-package_SHA256SUMS
#   kimi @moonshot-ai/kimi-code@0.39.1 —— GitHub 逐资产 .sha256 边车；CDN manifest.json platforms[].checksum
#   grok 1.0.13        —— 无官方清单（x.ai CDN 与 GitHub 均无），hash 承接 ohmypwsh catalog.psd1 自算 pin
# claude GCS 分发桶存在（stable 返回 2.1.236）但资产 URL 形状未实证（claude.ai 本机 DNS 不通）——留槽不填。
# codex 官方 install.sh 实证纯走 GitHub release（api.github.com 元数据 + releases/download 下载；
# README 的 releases.openai.com 是 404 死桶，npm 的 codex-npm-*.tgz 是 legacy 兜底制品）——github 即全渠道。
# GitHub release JSON 的 assets[].digest 自带 sha256 前缀逐资产哈希，oma update 取证一次 API 拿全。

[[agents]]
name = "claude"
tag = "v2.1.251"
version = "2.1.251"
binary = "claude"

[[agents.sources]]
