[package]
name = "oma"
version = "0.1.0"
edition = "2021"
description = "Oh My Agents：通用智能体多路复用任务编排器"
license = "MIT"
repository = "https://github.com/raystyle/OhMyAgents"

[[bin]]
name = "oma"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
ureq = { version = "2", features = ["tls"] }
which = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
rmux-sdk = "=0.10.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# assert_cmd 与 predicates 为 clap 官方生态标准 CLI 测试件（R005 选型：
# crates.io 稳定主流、持续维护），只进测试构建。
assert_cmd = "2"
predicates = "3"
