# - push main：构建测试后资产滚动挂 pre-release tag `dev`（本地测试期的滚动升级源，`oma self update`）；
# - push v* tag：构建测试后资产挂正式 release（封版触发，`oma self update --stable`）。
# 资产名即编译目标（selfupdate 按目标三元组映射）；mac 只要 arm64 不要 intel（用户裁决）
name: dev-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --features server,mcp --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          src="target/${triple}/release/oma"
          [ "${{ matrix.os }}" = "windows-latest" ] && src="${src}.exe"
          # 资产名即编译目标：oma-<triple>.zip / .tar.gz（selfupdate 按三元组映射）
          mkdir -p "dist/oma-${triple}"
          cp "$src" "dist/oma-${triple}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "oma-${triple}.zip" "oma-${triple}" || zip -r "oma-${triple}.zip" "oma-${triple}"
          else
            tar czf "oma-${triple}.tar.gz" "oma-${triple}"
          fi
          sha256sum "oma-${triple}.${{ matrix.archive }}" > "oma-${triple}.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: oma-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" dist/*.zip dist/*.tar.gz dist/*.sha256 --latest \
              --title "oma $tag" \
              --notes "正式版 $tag（版本 tag 触发构建）。安装：oma self update --stable。"
          else
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev dist/*.zip dist/*.tar.gz dist/*.sha256 --prerelease \
              --title "oma dev (rolling)" \
              --notes "滚动开发版：main 最新提交自动构建。安装：oma self update（默认 dev 通道）。"
          fi
