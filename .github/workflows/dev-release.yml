# - push main：构建测试后资产滚动挂 pre-release tag `dev`（本地测试期的滚动升级源，`hst self update`）；
# - push v* tag：构建测试后资产挂正式 release（封版触发，`hst self update --stable`）。
# 资产名即编译目标（selfupdate 按目标三元组映射）；mac 只要 arm64 不要 intel（用户裁决）。
# D29：主资产 hst-<triple>；过渡期同挂 oma-<triple>（stub bin，警告后转调 hst）；
# 镜像 hst/ 主段 sync，oma/ 兼容段只推 stub 资产（旧 oma self update 升到 stub 被引导换名）。
name: dev-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  docs-gate:
    # 三个 md 扫描进 CI（codex 验收 review 补：此前只在本地人工执行，
    # 标题括号类红两次溜过发布）。rumdl 需 Python 侧工具，走 uv。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Markdown gates
        run: |
          uv run --script .tools/md-ref-scan.py
          uv run --script .tools/md-heading-scan.py
          uv run --script .tools/mdcharlint.py
          uvx rumdl check .

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Package
        shell: bash
        run: |
          triple="${{ matrix.target }}"
          src="target/${triple}/release/hst"
          stub="target/${triple}/release/oma"
          [ "${{ matrix.os }}" = "windows-latest" ] && { src="${src}.exe"; stub="${stub}.exe"; }
          # 主资产 hst-<triple> 加过渡 stub 资产 oma-<triple>（D29）。
          mkdir -p "dist/hst-${triple}" "dist-stub/oma-${triple}"
          cp "$src" "dist/hst-${triple}/"
          cp "$stub" "dist-stub/oma-${triple}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "hst-${triple}.zip" "hst-${triple}" || zip -r "hst-${triple}.zip" "hst-${triple}"
          else
            tar czf "hst-${triple}.tar.gz" "hst-${triple}"
          fi
          sha256sum "hst-${triple}.${{ matrix.archive }}" > "hst-${triple}.${{ matrix.archive }}.sha256"
          cd ../dist-stub
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "oma-${triple}.zip" "oma-${triple}" || zip -r "oma-${triple}.zip" "oma-${triple}"
          else
            tar czf "oma-${triple}.tar.gz" "oma-${triple}"
          fi
          sha256sum "oma-${triple}.${{ matrix.archive }}" > "oma-${triple}.${{ matrix.archive }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hst-${{ matrix.target }}
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: oma-stub-${{ matrix.target }}
          path: dist-stub/*

  release:
    needs: [build, docs-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" dist/*.zip dist/*.tar.gz dist/*.sha256 --latest \
              --title "hst $tag" \
              --notes "正式版 $tag（版本 tag 触发构建）。安装：hst self update --stable。oma 旧命令请换 hst（oma-* 资产为过渡 stub，警告后转调 hst）。"
          else
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev dist/*.zip dist/*.tar.gz dist/*.sha256 --prerelease \
              --title "hst dev (rolling)" \
              --notes "滚动开发版：main 最新提交自动构建。安装：hst self update（默认 dev 通道）。oma-* 为过渡 stub。"
          fi

  # D41 路线 A（D29 更新）：产物镜像自推 R2（env 桶）——hst/ 主段 sync（dev 滚动与
  # stable tag），oma/ 兼容段只推 stub 资产一个版本（旧 oma self update 吃到 stub
  # 后被引导换 hst）。边车是 Package 步 sha256sum 原生格式（hex 空两格加名）。
  mirror:
    needs: release
    runs-on: ubuntu-latest
    env:
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      # 必带（D41 实证）：受限 token 无建桶权，预检 CreateBucket 会 403。
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Install rclone if missing
        run: command -v rclone || (curl -fsSL https://rclone.org/install.sh | sudo bash)
      - name: Mirror to R2
        run: |
          seg="dev"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && seg="stable"
          # hst 主资产与 oma stub 分目录收拢（download-artifact 平铺会混）。
          mkdir -p dist-hst dist-oma
          mv artifacts/hst-* dist-hst/ 2>/dev/null || true
          mv artifacts/oma-* dist-oma/ 2>/dev/null || true
          # 段内只留压缩包加边车；sync 加 --delete-excluded 清段内白名单外遗留。
          rclone sync dist-hst/ "r2:${R2_BUCKET}/hst/${seg}/" \
            --include "*.zip" --include "*.tar.gz" --include "*.sha256" \
            --delete-excluded \
            --header-upload "Cache-Control: public, max-age=60" \
            --checksum -v --stats-one-line
          rclone sync dist-oma/ "r2:${R2_BUCKET}/oma/${seg}/" \
            --include "*.zip" --include "*.tar.gz" --include "*.sha256" \
            --delete-excluded \
            --header-upload "Cache-Control: public, max-age=60" \
            --checksum -v --stats-one-line
          rclone lsl "r2:${R2_BUCKET}/hst/${seg}/"
          rclone lsl "r2:${R2_BUCKET}/oma/${seg}/"
